# Servidor por defecto: responde a hosts no reconocidos.
# /healthz lo usa el HEALTHCHECK del contenedor.
server {
    listen 80 default_server;
    server_name _;
    root /sites;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404 "Sitio no configurado. Anade su carpeta y su server block.\n";
    }
}
